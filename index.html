<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubSocial</title>
<style>
  :root {
    --bg: #0a0a0a; --card: #121212; --text: #e8e8e8; --muted: #8a8f9a;
    --snap: #FF5A5F; --vibe: #00F2EA; --talk: #FFFFFF; --info: #FFF0F5; --story: #8B5CF6;
  }
    * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 100px; }

  header { position: sticky; top:0; z-index:10; background: var(--card); padding: 14px; display: flex; justify-content: space-between; border-bottom: 1px solid #2a2e36; }
  header h1 { font-size: 20px; transition: color 0.3s; }
  #btnConfig { background:none; border:none; color:var(--muted); cursor:pointer; font-size:20px; }
  #btnClear { background:none; border:none; color:red; cursor:pointer; font-size:12px; margin-left:10px; }

.stories { display:flex; gap:12px; padding:12px; overflow-x:auto; background:var(--card); border-bottom:1px solid #2a2e36; }
.story { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:70px; cursor:pointer; }
.story-circle { width:64px; height:64px; border-radius:50%; padding:3px; background: linear-gradient(45deg, var(--story), #EC4899); }
.story img { width:100%; height:100%; border-radius:50%; object-fit:cover; border:2px solid var(--card); }
.story span { font-size:10px; color:var(--muted); }

.feed { max-width: 600px
