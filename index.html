<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubSocial</title>
<style>
:root{--bg:#0a0a0a;--card:#121212;--text:#e8e8e8;--muted:#8a8f9a;--snap:#FF5A5F;--vibe:#00F2EA;--talk:#FFFFFF;--info:#FFF0F5;--story:#8B5CF6;--accent:var(--snap)}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:var(--card);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2e36}
.header-buttons{display:flex;gap:8px}
#btnConfig,#btnClear,#btnFix{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px}
.feed{max-width:600px;margin:0 auto;padding:16px}
.post{background:var(--card);border-radius:12px;padding:12px;margin-bottom:16px;border:1px solid #1f232b}
.post.talk{background:#fff;color:#000;border:1px solid #ddd}
.post-header{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#333}
.username{font-weight:600}
.content{width:100%;border-radius:8px;margin:10px 0;max-height:500px;object-fit:cover}
.post-actions{display:flex;justify-content:space-around;margin-top:10px;padding-top:10px;border-top:1px solid #eee;color:#000}
.composer{background:var(--card);padding:14px;border-radius:12px;margin-top:20px}
.composer textarea{width:100%;background:#0a0a0a;border:1px solid #2a2e36;border-radius:8px;padding:10px;color:var(--text);margin-bottom:8px}
.composer button{background:var(--accent);color:#fff;border:none;padding:10px;width:100%;border-radius:8px;font-weight:700}
.tabs{display:flex;justify-content:space-around;background:var(--card);position:fixed;bottom:0;left:0;right:0;border-top:1px solid #2a2e36;padding:8px 0;z-index:10}
.tab{flex:1;text-align:center;cursor:pointer;color:var(--muted);font-size:11px;padding:6px}
.tab.active.talk{color:#000;background:#eee;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:20;padding:16px}
.modal-content{background:var(--card);padding:20px;border-radius:16px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;border:1px solid #2a2e36}
.upload-group{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #2a2e36}
.upload-group input{width:100%;margin:6px 0;padding:8px;background:#0a0a0a;border:1px solid #2a2e36;border-radius:6px;color:var(--text)}
.upload-group button{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:6px;width:100%;margin-top:6px;font-weight:600}
.talk-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.talk-menu-wrap{position:relative}
.talk-dots-btn{background:none;border:none;font-size:22px;cursor:pointer;color:#000;padding:4px 8px}
.talk-dropdown{position:absolute;right:0;top:28px;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.15);min-width:180px;display:none;z-index:99;overflow:hidden}
.talk-dropdown.show{display:block}
.talk-dropdown button{width:100%;background:none;border:none;text-align:left;padding:12px 14px;font-size:14px;cursor:pointer}
.talk-dropdown button:hover{background:#f5f5f5}
</style>
</head>
<body>
<header><h1>HubSocial</h1><div class="header-buttons"><button id="btnFix" onclick="fixUndefined()">🔧</button><button id="btnClear" onclick="clearPosts()">🗑️</button><button id="btnConfig" onclick="openConfig()">⚙️</button></div></header>
<div class="feed"><div id="posts"></div>
<div class="composer"><textarea id="text" rows="3" placeholder="Criar post..."></textarea><input type="file" id="media" accept="image/*,video/*"><button onclick="addPost()">Postar</button></div></div>
<div class="tabs" id="tabs"></div>
<div class="modal" id="configModal"><div class="modal-content">
<h2>Configurações</h2>
<div class="upload-group"><h3>Sua conta</h3><input type="text" id="myName" placeholder="Seu nome"><input type="file" id="myAvatar" accept="image/*" onchange="changeMyAvatar(event)"><button onclick="saveMyAccount()">Salvar</button></div>
<div class="upload-group"><h3>Adicionar Conta Snap</h3><input type="text" id="accountName" placeholder="Nome"><input type="file" id="accountImg" accept="image/*"><button onclick="addAccount()">Add</button></div>
<div class="upload-group"><h3>Adicionar Conta Vibe</h3><input type="text" id="vibeAccountName" placeholder="Nome"><input type="file" id="vibeAccountImg" accept="image/*"><button onclick="addVibeAccount()">Add Vibe</button></div>
<div class="upload-group"><h3>Adicionar Conta TalkNow com FOTO + VÍDEO</h3>
<input type="text" id="talkAccountName" placeholder="Nome da conta falsa">
<input type="file" id="talkAccountAvatar" accept="image/*"><small style="color:var(--muted)">Foto de perfil da conta</small>
<input type="text" id="talkAccountPost" placeholder="O que ela vai falar?" style="margin-top:8px">
<input type="file" id="talkAccountPostMedia" accept="image/*,video/*"><small style="color:var(--muted)">Foto ou vídeo do post (até 20s)</small>
<button onclick="addTalkAccount()">Adicionar Conta com Post</button></div>
<div class="upload-group"><h3>Post rápido TalkNow</h3><input type="text" id="talkPostUser" placeholder="Usuário"><input type="text" id="talkPostText" placeholder="Texto"><input type="file" id="talkPostMedia" accept="image/*,video/*"><button onclick="addTalkPost()">Postar Talk</button></div>
<button onclick="closeConfig()" style="width:100%;background:#555;border:none;padding:10px;border-radius:8px;color:#fff">Fechar</button>
</div></div>
<script>
const tabsData=[{id:'snap',name:'SnapLife'},{id:'vibe',name:'VibeClip'},{id:'talk',name:'TalkNow'},{id:'info',name:'InfoFlash'}];
let accounts=JSON.parse(localStorage.getItem('accounts'))||[{name:"voce",user:"voce",img:""}];
let posts=JSON.parse(localStorage.getItem('posts'))||[];
let currentTab=localStorage.getItem('currentTab')||'talk';
let hiddenTalkPosts=JSON.parse(localStorage.getItem('hiddenTalkPosts'))||[];
function toggleTalkMenu(id,e){e.stopPropagation();document.querySelectorAll('.talk-dropdown').forEach(d=>{if(d.id!=='talk-menu-'+id)d.classList.remove('show')});document.getElementById('talk-menu-'+id)?.classList.toggle('show')}
function hideTalkPost(id){hiddenTalkPosts.push(id);localStorage.setItem('hiddenTalkPosts',JSON.stringify(hiddenTalkPosts));const el=document.getElementById('post-'+id);if(el){el.style.opacity='0';setTimeout(()=>el.remove(),300)}}
document.addEventListener('click',()=>document.querySelectorAll('.talk-dropdown').forEach(d=>d.classList.remove('show')));
function renderTabs(){document.getElementById('tabs').innerHTML=tabsData.map(t=>`<div class="tab ${currentTab===t.id?'active '+t.id:''}" onclick="showFeed('${t.id}')">${t.name}</div>`).join('')}
function showFeed(id){currentTab=id;localStorage.setItem('currentTab',id);renderTabs();renderPosts()}
function renderPosts(){
  const c=document.getElementById('posts');c.innerHTML="";
  let filtered=posts.filter(p=>p.tab===currentTab);
  if(currentTab==='talk') filtered=filtered.filter(p=>!hiddenTalkPosts.includes(p.id));
  filtered.slice().reverse().forEach(p=>{
    const acc=accounts.find(a=>a.user===p.userId)||{name:p.userId,user:p.userId,img:""};
    let mediaHtml="";
    if(p.media){
      if(p.media.startsWith('data:video')||p.media.includes('video')) mediaHtml=`<video class="content" src="${p.media}" controls playsinline></video>`;
      else mediaHtml=`<img class="content" src="${p.media}">`;
    }
    if(p.tab==='talk'){
      c.innerHTML+=`<div class="post talk" id="post-${p.id}"><div class="talk-top-row"><div class="post-header"><img class="avatar" src="${acc.img||'https://via.placeholder.com/40/333/fff?text=@'}"><span class="username">@${acc.user}</span></div><div class="talk-menu-wrap"><button class="talk-dots-btn" onclick="toggleTalkMenu('${p.id}',event)">⋯</button><div class="talk-dropdown" id="talk-menu-${p.id}"><button onclick="hideTalkPost('${p.id}')">não tenho interesse</button></div></div></div><p>${p.text||''}</p>${mediaHtml}<div class="post-actions"><span>❤️ ${p.likes||0}</span><span>💬 ${p.comments||0}</span><span>🔄 ${p.shares||0}</span></div></div>`;
    } else {
      c.innerHTML+=`<div class="post ${p.tab}" id="post-${p.id}"><div class="post-header"><img class="avatar" src="${acc.img}"><span>${acc.name}</span></div><p>${p.text||''}</p>${mediaHtml}</div>`;
    }
  });
}
function addPost(){
  const text=document.getElementById('text').value;
  const file=document.getElementById('media').files[0];
  if(!text&&!file) return;
  if(file){const r=new FileReader();r.onload=e=>savePost(text,e.target.result);r.readAsDataURL(file);} else savePost(text,"");
}
function savePost(text,media){
  posts.push({id:Date.now().toString(),tab:currentTab,userId:accounts[0].user,text,media,likes:0,comments:0,shares:0});
  localStorage.setItem('posts',JSON.stringify(posts));document.getElementById('text').value="";document.getElementById('media').value="";renderPosts();
}
function addAccount(){const name=document.getElementById('accountName').value.trim();if(!name)return;const file=document.getElementById('accountImg').files[0];const done=(img)=>{accounts.push({name,user:name.toLowerCase().replace(/\s/g,''),img});localStorage.setItem('accounts',JSON.stringify(accounts));renderPosts()};if(file){const r=new FileReader();r.onload=e=>done(e.target.result);r.readAsDataURL(file);}else done("")}
function addVibeAccount(){const name=document.getElementById('vibeAccountName').value.trim();if(!name)return;const file=document.getElementById('vibeAccountImg').files[0];const done=(img)=>{accounts.push({name,user:name.toLowerCase().replace(/\s/g,''),img});localStorage.setItem('accounts',JSON.stringify(accounts))};if(file){const r=new FileReader();r.onload=e=>done(e.target.result);r.readAsDataURL(file);}else done("")}
function addTalkAccount(){
  const name=document.getElementById('talkAccountName').value.trim();
  const text=document.getElementById('talkAccountPost').value.trim();
  const avatarFile=document.getElementById('talkAccountAvatar').files[0];
  const mediaFile=document.getElementById('talkAccountPostMedia').files[0];
  if(!name) return alert("Bota o nome!");
  const processar=()=>{
    const user=name.toLowerCase().replace(/\s/g,'');
    const pAvatar=new Promise(res=>{if(!avatarFile)return res("");const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(avatarFile);});
    const pMedia=new Promise(res=>{if(!mediaFile)return res("");const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(mediaFile);});
    Promise.all([pAvatar,pMedia]).then(([avatarData,mediaData])=>{
      accounts.push({name,user,img:avatarData});localStorage.setItem('accounts',JSON.stringify(accounts));
      posts.push({id:Date.now().toString(),tab:'talk',userId:user,text,media:mediaData,likes:Math.floor(Math.random()*300),comments:0,shares:0});
      try{localStorage.setItem('posts',JSON.stringify(posts));}catch(e){alert("Vídeo grande demais pra salvar, mas vai aparecer agora. Grava em 480p que salva!")}
      renderPosts();alert(`@${user} criada com foto e vídeo!`);
    });
  };
  if(mediaFile && mediaFile.type.startsWith('video/')){
    const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);if(v.duration>20.5){alert(`Vídeo tem ${v.duration.toFixed(1)}s, corta pra 20s!`)}else{processar()}};v.src=URL.createObjectURL(mediaFile);
  } else processar();
}
function addTalkPost(){
  const user=document.getElementById('talkPostUser').value.trim()||accounts[0].user;
  const text=document.getElementById('talkPostText').value;
  const file=document.getElementById('talkPostMedia').files[0];
  const save=(m)=>{posts.push({id:Date.now().toString(),tab:'talk',userId:user,text,media:m||"",likes:0,comments:0,shares:0});localStorage.setItem('posts',JSON.stringify(posts));renderPosts()};
  if(file){const r=new FileReader();r.onload=e=>save(e.target.result);r.readAsDataURL(file);}else save("");
}
function saveMyAccount(){const n=document.getElementById('myName').value.trim();if(n){accounts[0].name=n;accounts[0].user=n.toLowerCase().replace(/\s/g,'');localStorage.setItem('accounts',JSON.stringify(accounts));renderPosts()}}
function changeMyAvatar(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{accounts[0].img=ev.target.result;localStorage.setItem('accounts',JSON.stringify(accounts));renderPosts()};r.readAsDataURL(f)}
function openConfig(){document.getElementById('configModal').style.display='flex'}
function closeConfig(){document.getElementById('configModal').style.display='none'}
function clearPosts(){if(confirm("Apagar tudo?")){localStorage.removeItem('posts');posts=[];renderPosts()}}
function fixUndefined(){posts.forEach(p=>{if(!p.userId)p.userId=accounts[0].user});localStorage.setItem('posts',JSON.stringify(posts));renderPosts()}
renderTabs();renderPosts();
</script>
</body>
</html>
