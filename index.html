<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{ background:#fff; font-family:sans-serif; margin:0; padding-bottom:80px; }
.post.talk{ background:#fff; border:1px solid #ddd; border-radius:12px; padding:12px; margin:12px; }
.post-header{ display:flex; align-items:center; gap:10px; }
.avatar{ width:40px; height:40px; border-radius:50%; object-fit:cover; }
.talk-top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.talk-menu-wrap{ position:relative; }
.talk-dots-btn{ background:none; border:none; font-size:22px; cursor:pointer; padding:4px 8px; }
.talk-dropdown{ position:absolute; right:0; top:28px; background:#fff; border:1px solid #ddd; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.15); min-width:180px; display:none; z-index:99; }
.talk-dropdown.show{ display:block; }
.talk-dropdown button{ width:100%; background:none; border:none; text-align:left; padding:12px; font-size:14px; }
.content{ width:100%; border-radius:12px; margin-top:10px; }
.post-actions{ display:flex; gap:15px; margin-top:12px; border-top:1px solid #ddd; padding-top:10px; }
</style>
</head>
<body>
<div id="posts"></div>

<script>
let accounts = JSON.parse(localStorage.getItem('accounts')) || [{user:"lucas", img:""}, {user:"joaninha", img:""}];
let posts = JSON.parse(localStorage.getItem('posts')) || [
  {id:"1", tab:"talk", userId:"lucas", text:"N sei oq ka", media:"", likes:297, comments:56, shares:45},
  {id:"2", tab:"talk", userId:"joaninha", text:"", media:"", likes:0, comments:0, shares:0}
];
let hiddenTalkPosts = JSON.parse(localStorage.getItem('hiddenTalkPosts')) || [];

function toggleTalkMenu(id,e){
  e.stopPropagation();
  document.querySelectorAll('.talk-dropdown').forEach(d=>{
    if(d.id !== 'talk-menu-'+id) d.classList.remove('show');
  });
  document.getElementById('talk-menu-'+id).classList.toggle('show');
}
function hideTalkPost(id){
  hiddenTalkPosts.push(id);
  localStorage.setItem('hiddenTalkPosts', JSON.stringify(hiddenTalkPosts));
  document.getElementById('post-'+id).remove();
}
document.addEventListener('click',()=>{
  document.querySelectorAll('.talk-dropdown').forEach(d=>d.classList.remove('show'));
});

function renderPosts(){
  const c = document.getElementById('posts');
  c.innerHTML = "";
  posts.filter(p=>p.tab==='talk' && !hiddenTalkPosts.includes(p.id)).reverse().forEach(p=>{
    const acc = accounts.find(a=>a.user===p.userId) || {user:p.userId, img:"https://via.placeholder.com/40"};
    c.innerHTML += `
    <div class="post talk" id="post-${p.id}">
      <div class="talk-top-row">
        <div class="post-header">
          <img class="avatar" src="${acc.img}">
          <span>@${acc.user}</span>
        </div>
        <div class="talk-menu-wrap">
          <button class="talk-dots-btn" onclick="toggleTalkMenu('${p.id}',event)">⋯</button>
          <div class="talk-dropdown" id="talk-menu-${p.id}">
            <button onclick="hideTalkPost('${p.id}')">não tenho interesse</button>
          </div>
        </div>
      </div>
      <p>${p.text}</p>
      ${p.media ? `<img class="content" src="${p.media}">` : `<img class="content" src="https://via.placeholder.com/600x400">`}
      <div class="post-actions">
        <span>❤️ ${p.likes}</span>
        <span>💬 ${p.comments}</span>
        <span>🔄 ${p.shares}</span>
      </div>
    </div>`;
  });
}
renderPosts();
</script>
</body>
</html>
