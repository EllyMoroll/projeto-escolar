
     <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubSocial</title>
<style>
  :root {
    --bg: #0a0a0a; --card: #121212; --text: #e8e8e8; --muted: #8a8f9a;
    --snap: #FF5A5F; --vibe: #00F2EA; --talk: #FFFFFF; --info: #FFF0F5; --story: #8B5CF6;
  }
    * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 100px; }

  header { position: sticky; top:0; z-index:10; background: var(--card); padding: 14px; display: flex; justify-content: space-between; border-bottom: 1px solid #2a2e36; }
  header h1 { font-size: 20px; transition: color 0.3s; }
  #btnConfig { background:none; border:none; color:var(--muted); cursor:pointer; font-size:20px; }

.stories { display:flex; gap:12px; padding:12px; overflow-x:auto; background:var(--card); border-bottom:1px solid #2a2e36; }
.story { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:70px; cursor:pointer; }
.story-circle { width:64px; height:64px; border-radius:50%; padding:3px; background: linear-gradient(45deg, var(--story), #EC4899); }
.story img { width:100%; height:100%; border-radius:50%; object-fit:cover; border:2px solid var(--card); }
.story span { font-size:10px; color:var(--muted); }

.feed { max-width: 600px; margin: 0 auto; padding: 16px; }
.post { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 16px; position:relative; }
.post.snap { border-left: 4px solid var(--snap); }
.post.vibe { background:#000; border-radius:0; height: 85vh; display:flex; align-items:center; justify-content:center; padding:0; border:none; margin:0 auto 16px; }
.post.talk { border-radius:0; border-left: 4px solid #ddd; background: var(--talk); color:#000; }
.post.talk .username, .post.talk p { color:#000; }
.post.info { border-radius:16px; border:1px solid #FFB6C1; background: var(--info); color:#333; padding:16px; }
.post.info .post-header { display:none; }
.post-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.avatar { width:36px; height:36px; border-radius:50%; background:#333; object-fit:cover; cursor:pointer; }
.username { font-weight: bold; font-size: 14px; }
.post img.content { width:100%; border-radius:8px; margin:8px 0; }
.post p { font-size: 14px; line-height: 1.4; }
.post.info h3 { margin-bottom:8px; font-size:18px; }

  /* VIBECLIP TIKTOK REAL */
.vibe-container { position:relative; width:100%; height:100%; }
.vibe-container video { width:100%; height:100%; object-fit:cover; }
.vibe-side { position:absolute; right:12px; bottom:100px; display:flex; flex-direction:column; gap:24px; align-items:center; z-index:2; } /* VERTICAL */
.vibe-btn { display:flex; flex-direction:column; align-items:center; cursor:pointer; color:#fff; }
.vibe-btn span { font-size:12px; font-weight:bold; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
.heart { font-size:32px; transition: transform 0.2s; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
.heart.liked { color:red; animation: pop 0.3s; }
@keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.6);} 100%{transform:scale(1);} }

.vibe-info { position:absolute; bottom:20px; left:12px; right:80px; color:#fff; z-index:2; } /* POR CIMA DO VIDEO */
.vibe-info b { font-size:15px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
.vibe-info p { margin-top:6px; font-size:14px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
.vibe-gradient { position:absolute; bottom:0; left:0; right:0; height:200px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); z-index:1; }

.count-edit { background:transparent; border:none; color:inherit; width:40px; text-align:center; font-size:12px; font-weight:bold; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
.count-edit:focus { outline:1px dashed #fff; }

.post-actions { display:flex; gap:24px; margin-top:8px; justify-content:space-around; }
.action-btn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; display:flex; align-items:center; gap:4px; }
.post.talk .action-btn { color:#555; }
.post.info .post-actions { display:none; }
.count-edit-normal { background:transparent; border:none; color:inherit; width:40px; text-align:center; font-size:14px; }

.composer { background: var(--card); padding: 12px; border-radius: 12px; margin-top: 20px; border:1px dashed #2a2e36; }
.post.talk .composer { background:#f5f5f5; border-color:#ddd; }
.post.info .composer { background:#FFE4E1; border-color:#FFB6C1; }
.composer textarea { width:100%; background:#0a0a0a; border:1px solid #2a2e36; border-radius:8px; padding:8px; color:var(--text); resize:none; }
.post.talk .composer textarea { background:#fff; color:#000; border-color:#ddd; }
.post.info .composer textarea { background:#fff; color:#000; border-color:#FFB6C1; }
.composer input { margin: 8px 0; color: var(--muted); font-size:12px; }
.composer button { background: var(--accent); color:white; border:none; padding: 8px 16px; border-radius:8px; cursor:pointer; font-weight:bold; }
#mediaLabel { font-size:12px; color:var(--muted); }

.tabs { display: flex; justify-content: space-around; background: var(--card); position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid #2a2e36; padding: 8px 0; }
.tab { flex: 1; text-align: center; cursor: pointer; padding: 6px; color: var(--muted); font-size: 11px; }
.tab.active.snap { color: var(--snap); }.tab.active.vibe { color: var(--vibe); }
.tab.active.talk { color: #000; background:#eee; }.tab.active.info { color: #FF69B4; }
.tab img { width: 24px; height: 24px; display:block; margin: 0 auto 4px; border-radius:4px; object-fit:cover; }

.modal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:20; }
.modal-content { background:var(--card); padding:20px; border-radius:12px; width:90%; max-width:400px; max-height:80vh; overflow-y:auto; }
.upload-group { margin-bottom:12px; border-bottom:1px solid #2a2e36; padding-bottom:12px; }
</style>
</head>
<body>

<header>
  <h1 id="headerTitle">HubSocial</h1>
  <button id="btnConfig" onclick="openConfig()">⚙️</button>
</header>

<div class="stories" id="stories" style="display:none;"></div>

<div class="feed">
  <div id="posts"></div>

  <div class="composer">
    <textarea id="text" rows="3" placeholder="Criar post..."></textarea>
    <label id="mediaLabel">Adicionar Imagem:</label>
    <input type="file" id="media" accept="image/*">
    <button onclick="addPost()">Postar</button>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="modal" id="configModal">
  <div class="modal-content">
    <h2>Configurar</h2>
    <div class="upload-group">
      <h3>Sua Foto de Perfil</h3>
      <input type="file" id="myAvatar" accept="image/*" onchange="changeMyAvatar(event)">
    </div>
    <div class="upload-group">
      <h3>Ícones das Abas</h3>
      <div id="iconUploads"></div>
    </div>
    <div class="upload-group">
      <h3>Adicionar "Contas" pros Stories</h3>
      <input type="text" id="accountName" placeholder="Nome da conta">
      <input type="file" id="accountImg" accept="image/*">
      <button onclick="addAccount()">Adicionar Conta</button>
    </div>
    <button onclick="closeConfig()">Salvar e Fechar</button>
  </div>
</div>

<script>
  const tabsData = [
    {id: 'snap', name: 'SnapLife', color:'--snap', media:'image/*', showStories:true},
    {id: 'vibe', name: 'VibeClip', color:'--vibe', media:'video/*,image/*', showStories:false},
    {id: 'talk', name: 'TalkNow', color:'--talk', media:'image/*', showStories:false},
    {id: 'info', name: 'InfoFlash', color:'--info', media:'image/*', showStories:false}
  ];
  
  let accounts = JSON.parse(localStorage.getItem('accounts')) || [
    {name:"Você", img:"", user:"voce"},
    {name:"Maria Tech", img:"", user:"mariatech"},
    {name:"Joãozinho", img:"", user:"joaozinho"},
    {name:"Portal News", img:"", user:"portalnews"}
  ];
  
  let currentTab = 'snap';
  let posts = JSON.parse(localStorage.getItem('posts')) || [
    {id:1, tab:'talk', user:"Maria Tech", userId:"mariatech", text:"Lançaram um novo framework hoje. Alguém já testou?", media:null, likes:124, liked:false, comments:18, reposts:5},
    {id:2, tab:'talk', user:"Joãozinho", userId:"joaozinho", text:"Almoço de domingo é sagrado né", media:null, likes:89, liked:true, comments:32, reposts:2}
  ];
  let icons = JSON.parse(localStorage.getItem('icons')) || {};

  function renderTabs() {
    const tabsDiv = document.getElementById('tabs');
    tabsDiv.innerHTML = "";
    tabsData.forEach(t => {
      tabsDiv.innerHTML += `
        <div class="tab ${currentTab===t.id?'active '+t.id:''}" onclick="showFeed('${t.id}')">
          <img src="${icons[t.id] || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIGZpbGw9IiM4YThmOWEiIHZpZXdCb3g9IjAgMCAyNCAyNCI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTAiLz48L3N2Zz4='}" alt="${t.name}">
          ${t.name}
        </div>
      `;
    });
    const current = tabsData.find(t=>t.id===currentTab);
    document.getElementById('headerTitle').innerText = current.name;
    document.getElementById('headerTitle').style.color = `var(${current.color})`;
    document.getElementById('stories').style.display = current.showStories ? 'flex' : 'none';
    document.getElementById('media').accept = current.media;
    document.getElementById('mediaLabel').innerText = currentTab==='vibe'? "Adicionar Vídeo ou Imagem:" : "Adicionar Imagem:";
    document.documentElement.style.setProperty('--accent', `var(${current.color})`);
    document.body.style.background = current.id==='talk' ? '#fff' : current.id==='info' ? '#FFF0F5' : 'var(--bg)';
  }

  function toggleLike(id) {
    const post = posts.find(p => p.id === id);
    post.liked = !post.liked;
    post.likes += post.liked ? 1 : -1;
    localStorage.setItem('posts', JSON.stringify(posts));
    renderPosts();
  }
  
  function editCount(id, type, el) {
    const val = parseInt(el.value) || 0;
    const post = posts.find(p => p.id === id);
    post[type] = val;
    localStorage.setItem('posts', JSON.stringify(posts));
  }

  function renderStories() {
    const sDiv = document.getElementById('stories');
    sDiv.innerHTML = "";
    accounts.forEach(a => {
      sDiv.innerHTML += `
        <div class="story">
          <div class="story-circle"><img src="${a.img || 'https://via.placeholder.com/64'}" alt=""></div>
          <span>${a.name}</span>
        </div>
      `;
    });
  }

  function changeMyAvatar(e) {
    const reader = new FileReader();
    reader.onload = ev => {
      accounts[0].img = ev.target.result;
      localStorage.setItem('accounts', JSON.stringify(accounts));
      renderStories(); renderPosts();
    }
    reader.readAsDataURL(e.target.files[0]);
  }

  function addAccount() {
    const name = document.getElementById('accountName').value;
    const file = document.getElementById('accountImg').files[0];
    if(!name ||!file) return alert("Coloca nome e imagem");
    const user = name.toLowerCase().replace(/\s/g,'');
    const reader = new FileReader();
    reader.onload = e => {
      accounts.push({name, img:e.target.result, user});
      localStorage.setItem('accounts', JSON.stringify(accounts));
      renderStories();
      document.getElementById('accountName').value = "";
    }
    reader.readAsDataURL(file);
  }

  function openConfig() {
    const uploadsDiv = document.getElementById('iconUploads');
    uploadsDiv.innerHTML = "";
    tabsData.forEach(t => {
      uploadsDiv.innerHTML += `<label>${t.name}</label><input type="file" accept="image/*" onchange="uploadIcon(event, '${t.id}')"><br><br>`;
    });
    document.getElementById('configModal').style.display = 'flex';
  }
  function uploadIcon(e, tabId) {
    const reader = new FileReader();
    reader.readAsDataURL(e.target.files[0]);
    reader.onload = ev => { icons[tabId] = ev.target.result; localStorage.setItem('icons', JSON.stringify(icons)); renderTabs(); }
  }
  function closeConfig() { document.getElementById('configModal').style.display = 'none'; }

  function showFeed(tab) { currentTab = tab; renderTabs(); renderPosts(); }

  function addPost() {
    const text = document.getElementById('text').value;
    const file = document.getElementById('media').files[0];
    const savePost = (mediaData, type) => {
      const acc = accounts[0];
      posts.unshift({id:Date.now(), tab:currentTab, user:acc.name, userId:acc.user, text, media:mediaData, mediaType:type, likes:0, liked:false, comments:0, reposts:0});
      localStorage.setItem('posts', JSON.stringify(posts));
      document.getElementById('text').value = ""; document.getElementById('media').value = "";
      renderPosts();
    }
    if (file) {
      const reader = new FileReader();
      reader.onload = e => savePost(e.target.result, file.type.startsWith('video')? 'video' : 'image');
      reader.readAsDataURL(file);
    } else savePost(null, null);
  }

  function renderPosts() {
    const container = document.getElementById('posts');
    container.innerHTML = "";
    posts.filter(p => p.tab === currentTab).forEach(p => {
      const acc = accounts.find(a=>a.user===p.userId) || accounts[0];
      
      if(p.tab === 'vibe' && p.mediaType === 'video') {
        container.innerHTML += `
          <div class="post vibe">
            <div class="vibe-container">
              <video src="${p.media}" autoplay loop muted playsinline></video>
              <div class="vibe-gradient"></div> <!-- ESCURECE EMBAIXO -->
              
              <!-- BOTOES VERTICAIS -->
              <div class="vibe-side">
                <div class="vibe-btn" onclick="toggleLike(${p.id})">
                  <div class="heart ${p.liked?'liked':''}">❤️</div>
                  <input class="count-edit" value="${p.likes}" onchange="editCount(${p.id},'likes',this)">
                </div>
                <div class="vibe-btn"><div>💬</div><input class="count-edit" value="${p.comments}" onchange="editCount(${p.id},'comments',this)"></div>
                <div class="vibe-btn"><div>🔄</div><input class="count-edit" value="${p.reposts}" onchange="editCount(${p.id},'reposts',this)"></div>
              </div>
              
              <!-- INFO POR CIMA DO VIDEO -->
              <div class="vibe-info">
                <div style="display:flex; gap:8px; align-items:center;">
                  <img class="avatar" style="width:32px; height:32px; border:2px solid #fff;" src="${acc.img || 'https://via.placeholder.com/32'}">
                  <b>@${p.userId}</b>
                </div>
                <p>${p.text}</p>
              </div>
            </div>
          </div>
        `;
      } else if(p.tab === 'info') {
        container.innerHTML += `
          <div class="post ${p.tab}">
            <h3>${p.text.split('\n')[0] || 'Título da Notícia'}</h3>
            <p>${p.text}</p>
            ${p.mediaType==='image'? `<img class="content" src="${p.media}">` : ""}
          </div>
        `;
      } else {
        let mediaHTML = "";
        if(p.mediaType==='image') mediaHTML = `<img class="content" src="${p.media}">`;
        if(p.mediaType==='video') mediaHTML = `<video class="content" src="${p.media}" controls></video>`;

        container.innerHTML += `
          <div class="post ${p.tab}">
            <div class="post-header"><img class="avatar" src="${acc.img || 'https://via.placeholder.com/36'}"><div><div class="username">@${p.userId}</div></div></div>
            <p>${p.text}</p>
            ${mediaHTML}
            <div class="post-actions">
              <button class="action-btn ${p.liked?'liked':''}" onclick="toggleLike(${p.id})">❤️ <input class="count-edit-normal" value="${p.likes}" onchange="editCount(${p.id},'likes',this)"></button>
              <button class="action-btn">💬 <input class="count-edit-normal" value="${p.comments}" onchange="editCount(${p.id},'comments',this)"></button>
              <button class="action-btn">🔄 <input class="count-edit-normal" value="${p.reposts}" onchange="editCount(${p.id},'reposts',this)"></button>
            </div>
          </div>
        `;
      }
    });
  }

  renderTabs(); renderStories(); renderPosts();
</script>
</body>
</html>
